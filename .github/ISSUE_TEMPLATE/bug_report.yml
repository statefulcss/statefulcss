name: Bug report
description: Something in a package or on the website doesn't work as documented.
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing issues](https://github.com/statefulcss/statefulcss/issues) first. Report security issues [privately](https://github.com/statefulcss/statefulcss/security/advisories/new), not here.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@statefulcss/stylelint-plugin"
        - "statefulcss (CLI)"
        - "Website and docs (statefulcss.com)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, from `npm ls <package>`. For the website, the page URL.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full message or output, if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: The smallest CSS and config that show the problem, and the command you ran. A link to a repository works too.
      placeholder: |
        ```css
        .button { … }
        ```

        ```json
        { "extends": ["@statefulcss/stylelint-plugin/recommended"] }
        ```

        npx stylelint "src/**/*.css"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Node.js: 22.18.0
        - Stylelint: 17.16.0
        - OS: macOS 26
        - Browser, for the website: Chrome 141
    validations:
      required: false
