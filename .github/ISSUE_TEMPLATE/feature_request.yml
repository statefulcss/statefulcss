name: Feature request
description: Suggest a rule, an option, a change to the methodology, or an improvement to the docs.
labels: ["enhancement"]

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "@statefulcss/stylelint-plugin"
        - "@statefulcss/core"
        - "@statefulcss/config"
        - "statefulcss (CLI)"
        - "The methodology"
        - "Website and docs (statefulcss.com)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? A CSS example helps.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
