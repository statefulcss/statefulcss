name: Setup
description: Install pnpm, Node.js from .nvmrc, and workspace dependencies. Run actions/checkout first.

inputs:
  cache:
    description: Cache the pnpm store. Set to "false" in jobs that deploy or publish.
    default: "true"
  registry-url:
    description: npm registry to configure for publishing.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
