allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
catalog:
  "@eslint/js": ^10.0.1
  # Node types match the lowest Node version the packages support (config and core: 22.18; stylelint-plugin: 22.22.2).
  "@types/node": ^22.20.5
  "@typescript-eslint/parser": ^8.72.2
  eslint: ^10.14.0
  postcss-html: ^2.0.1
  stylelint: ^18.0.0
  typescript: ^6.0.3
  typescript-eslint: ^8.72.2
  vitest: ^5.0.5
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
overrides:
  # satori pins fflate 0.7.3 (GHSA-px8p-9vwx-vf98); 0.7.5 is the fixed 0.7 release.
  "fflate@<0.7.5": ^0.7.5
packages:
  - apps/*
  - packages/*
