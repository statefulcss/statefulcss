allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
catalog:
  "@eslint/js": ^10.0.1
  # Node types match the lowest Node version the packages support (config, core, stylelint-plugin: 22.18).
  "@types/node": ^22.18.13
  "@typescript-eslint/parser": ^8.72.0
  eslint: ^10.13.0
  stylelint: ^17.16.0
  typescript: ^6.0.3
  typescript-eslint: ^8.72.0
  vitest: ^5.0.5
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
overrides:
  # satori pins fflate 0.7.3 (GHSA-px8p-9vwx-vf98); 0.7.5 is the fixed 0.7 release.
  "fflate@<0.7.5": ^0.7.5
packages:
  - apps/*
  - packages/*
